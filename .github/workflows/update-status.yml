name: Refresh portfolio activity
on:
  schedule:
    # Daily at 12:00 UTC (5 AM Arizona). Commits only when activity changes.
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh GitHub snapshot
        run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      - name: Commit snapshot if activity changed
        id: commit
        run: |
          FILE=src/content/status/github-data.json
          # lastUpdate changes on every run; only commit when the activity itself changed.
          if git show HEAD:"$FILE" | jq -S 'del(.lastUpdate)' > /tmp/previous.json \
            && jq -S 'del(.lastUpdate)' "$FILE" | cmp -s - /tmp/previous.json; then
            git checkout -- "$FILE"
            echo "No activity changes; skipping commit and deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$FILE"
          git commit -m "chore: refresh portfolio activity [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy existing Vercel site
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --output /dev/null --request POST "$DEPLOY_HOOK"
          fi
